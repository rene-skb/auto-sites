<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Sites — Lucy's Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0b;
      color: #e8e8e8;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 48px 24px 80px;
    }

    header {
      max-width: 960px;
      margin: 0 auto 48px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 8px;
    }

    header p {
      color: #666;
      font-size: 0.95rem;
    }

    header p span {
      color: #4fc3a1;
    }

    .filters {
      max-width: 960px;
      margin: 0 auto 32px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #1a1a1c;
      border: 1px solid #2a2a2e;
      color: #888;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #4fc3a1;
      border-color: #4fc3a1;
      color: #0a0a0b;
    }

    .grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: #111113;
      border: 1px solid #1e1e22;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
      text-decoration: none;
      display: block;
    }

    .card:hover {
      border-color: #4fc3a1;
      transform: translateY(-2px);
    }

    .card-preview {
      width: 100%;
      height: 180px;
      background: #1a1a1c;
      overflow: hidden;
      position: relative;
    }

    .card-preview iframe {
      width: 200%;
      height: 400px;
      border: none;
      transform: scale(0.5);
      transform-origin: top left;
      pointer-events: none;
    }

    .card-body {
      padding: 16px;
    }

    .card-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 0.78rem;
      color: #555;
      margin-bottom: 10px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-category {
      font-size: 0.72rem;
      background: #1e1e22;
      color: #888;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-score {
      font-size: 0.78rem;
      color: #4fc3a1;
      font-weight: 500;
    }

    .count {
      color: #555;
      font-size: 0.8rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>

    <p class="count" id="count"></p>

    let activeFilter = 'all';

    function filter(tag) {
      activeFilter = tag;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function render() {
      const grid = document.getElementById('grid');
      const filtered = activeFilter === 'all'
        ? builds
        : builds.filter(b => b.tags.includes(activeFilter) || b.city.toLowerCase().includes(activeFilter));

      document.getElementById('count').textContent = `${filtered.length} builds`;

      grid.innerHTML = filtered.map(b => `
        <a class="card" href="https://auto-sites.pages.dev/demos/${b.slug}/" target="_blank">
          <div class="card-preview">
            <iframe src="https://auto-sites.pages.dev/demos/${b.slug}/" loading="lazy" title="${b.name}"></iframe>
          </div>
          <div class="card-body">
            <div class="card-name">${b.name}</div>
            <div class="card-meta">${b.city}</div>
            <div class="card-footer">
              <span class="card-category">${b.category}</span>
              ${b.score !== '—' ? `<span class="card-score">★ ${b.score}</span>` : ''}
            </div>
          </div>
        </a>
      `).join('');
    }

    render();
