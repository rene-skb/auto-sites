tAlign":"","repeatables":[{"id":1,"link":{"label":"Learn more"},"text":{"content":{"quill":{"ops":[{"insert":"Every piercing I perform is approached with intention, precision, and a strong commitment to safety and long-term healing. I use "},{"insert":"implant-grade titanium exclusively","attributes":{"bold":true}},{"insert":", carefully selecting "},{"insert":"internally threaded or threadless jewelry","attributes":{"bold":true}},{"insert":" to reduce irritation, prevent tissue damage, and support the body\u2019s natural healing process as well as single use needles. Jewelry quality and proper fit are never compromised, ensuring each piercing is set up for success from day one."},{"insert":"\n","attributes":{"block":true}},{"insert":"Client education is a major part of my practice. I provide "},{"insert":"thorough written and verbal aftercare instructions","attributes":{"bold":true}},{"insert":", taking the time to explain the healing process, what to expect, and how to properly care for your piercing at every stage. I believe informed clients heal better, feel more confident, and have a more positive overall experience.\nSterility is held to the highest standard in my studio. \n\n"}]}}},"title":{"title":{"quill":{"ops":[{"insert":"\n"}]}}}}],"sectionTitle":{"title":{"quill":{"ops":[{"insert":"Piercings "},{"insert":"\n","attributes":{"block":true}}]}}}}}},{"id":"435873f0-0139-11f1-bb13-793dae9790fc","type":"cell","content":{"id":"435873f1-0139-11f1-bb13-793dae9790fc","type":"block","layout":"text-4","purpose":"text@^1.0.0","properties":{"shortID":"Nxonyl","settings":{"texts":{},"titles":{}},"textAlign":"","repeatables":[{"id":1,"link":{"label":"\n"},"text":{"content":{"quill":{"ops":[{"insert":"We offer professional piercings for babies and children 6 months and older.\nEach piercing is performed using single-use, sterile needles, providing a gentler experience with less tissue trauma and a higher level of precision and hygiene than traditional piercing methods.\n\nSafety, comfort, and care are at the heart of everything we do. Ensuring a calm, clean, and elevated experience for both children and parents."},{"insert":"\n","attributes":{"block":true}}]}}},"title":{"title":{"quill":{"ops":[{"insert":"6 months and older"},{"insert":"\n","attributes":{"block":true}}]}}}}],"sectionTitle":{"title":{"quill":{"ops":[{"insert":"Children\u2019s Piercing\n"}]}}}}}},{"id":"67415870-013b-11f1-bb13-793dae9790fc","type":"cell","content":{"id":"67415871-013b-11f1-bb13-793dae9790fc","type":"block","layout":"text-4","purpose":"text@^1.0.0","properties":{"shortID":"pEWbsV","settings":{"links":{"hidden":true},"texts":{},"titles":{}},"textAlign":"","repeatables":[{"id":1,"link":{"label":"This is not a substitute for medical advice \n"},"text":{"content":{"quill":{"ops":[{"insert":"What to Clean With:","attributes":{"bold":true}},{"insert":"\nExternal Piercings: Neil Med Piercing Aftercare Spray\nOral Piercings: Alcohol free mouth wash\n\u00a0\n"},{"insert":"DO NOT USE","attributes":{"bold":true}},{"insert":": rubbing alcohol, hydrogen peroxide, creams, salves, fragrant soaps, etc. These can cause the piercing to dry out, reduce air circulation, and damage the piercing.\u00a0"},{"insert":"\n","attributes":{"block":true}},{"insert":"\u00a0"},{"insert":"\n","attributes":{"block":true}},{"insert":"How to Clean:","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"- Clean your piercing 3 times a day, no more no less\n- Wash your hands with soap and water\n- Use saline to clean off \u2018crusties\u2019 or blood, soaking a cotton pad in saline and putting it on the piercing can loosen up the body fluids from the jewelry and wound\n- Dry off the piercing with gauze\n\u00a0"},{"insert":"\n","attributes":{"block":true}},{"insert":"What is Normal:","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"- First 2 weeks: Light bleeding, bruising, swelling, redness, soreness, mild pain\n- Up to 18 months: Discolouration, itching, oozing of white fluid - sebum can form \n- Clean your piercing even after you think it is completely healed, as secretions may build up and cause an unpleasant odour\u00a0\n- The piercing may seem healed but may not be on the inside yet, be gentle with it and clean it the entire healing period\n- If you have had a piercing for many years it can still close in after taking out the jewelry, but it may leave a scar\n\u00a0\n\u00a0\n"},{"insert":"Tips & Tricks:","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"- Avoid high waisted pants with navel piercing\n- Sports bras are your new BFF for nipple piercings\n- Keep helmets, headphones, glasses, phones, masks and hats clean so they don\u2019t transfer bacteria to your piercing\n- Do not sleep on your piercing, or use a travel pillow\n- Tell your hair dresser your ear is sore from your piercing and to be careful when styling\/ colouring\/ cutting your hair"},{"insert":"\n\n","attributes":{"block":true}},{"insert":"THIS IS NOT A  SUBSTITUTE FOR MEDICAL ADVISE","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"\n"}]}}},"title":{"title":{"quill":{"ops":[{"insert":"please call if you have more questions "},{"insert":"\n","attributes":{"block":true}}]}}}}],"sectionTitle":{"title":{"quill":{"ops":[{"insert":"Piercing Aftercare \n"}]}}}}}},{"id":"7d1b6980-0161-11f1-99b6-a7b46f57fa78","type":"cell","content":{"id":"7d1b6981-0161-11f1-99b6-a7b46f57fa78","type":"block","layout":"text-4","purpose":"text@^1.0.0","properties":{"shortID":"ORarsV","settings":{"texts":{}},"columnCount":1,"repeatables":[{"id":1,"link":{"label":"Learn more"},"text":{"content":{"quill":{"ops":[{"insert":"Second Skin:","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"Second skin bandages","attributes":{"bold":true}},{"insert":" can be worn for up to 5 days. Afterwards, continue your healing outlined below until your tattoo is 100% healed (approx. 3 weeks). A tattoo is an open wound, keeping it clean and safe from bacteria is crucial."},{"insert":"\n","attributes":{"block":true}},{"insert":"8-24 hours after:"},{"insert":"\n","attributes":{"block":true}},{"insert":"If there is no visible blood or plasma under the bandage, it is not"},{"insert":"\n","attributes":{"block":true}},{"insert":"necessary or recommended to take it off at this time"},{"insert":"\n","attributes":{"block":true}},{"insert":" If there is visible blood & plasma build up at this time, remove the"},{"insert":"\n","attributes":{"block":true}},{"insert":"bandage Removing the bandage:"},{"insert":"\n","attributes":{"block":true}},{"insert":"For best results slowly remove in the shower\/underwater"},{"insert":"\n","attributes":{"block":true}},{"insert":"Next, gently clean the area with mild and unscented soap and use"},{"insert":"\n","attributes":{"block":true}},{"insert":"paper towel to pat dry *do not rub*"},{"insert":"\n","attributes":{"block":true}},{"insert":"Follow \u201cafter bandage care\u201d"},{"insert":"\n\n","attributes":{"block":true}},{"insert":"Traditional Wrap (plastic wrap):","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"Traditional wrap bandages are typically worn for 3-5 hours. Follow instructions until your tattoo is 100% heals (approx. 3 weeks). A tattoo is an open wound, keeping it clean and safe from bacteria is crucial"},{"insert":"\n","attributes":{"block":true}},{"insert":"3-5 hours after:"},{"insert":"\n","attributes":{"block":true}},{"insert":"After removing bandage, gently clean the area with mild unscented soap and use a paper towel to pay dry *do not rub*"},{"insert":"\n","attributes":{"block":true}},{"insert":"Follow \u201cafter bandage care\u201d"},{"insert":"\n\n","attributes":{"block":true}},{"insert":"After Bandage Care Early Healing Phase","attributes":{"bold":true}},{"insert":"\nWash gently 1\u20132 times per day with mild soap and water. Use paper towel to pat the area dry."},{"insert":"\n","attributes":{"block":true}},{"insert":" Apply a thin layer of fragrance-free lotion or tattoo-specific ointment (like Aquaphor or Hustle Butter) after each wash."},{"insert":"\n","attributes":{"block":true}},{"insert":" Avoid letting the tattoo dry out or stay too moist. Balance is key. Week 2\u20134: Ongoing Care"},{"insert":"\n","attributes":{"block":true}},{"insert":" Continue moisturizing 1\u20132 times daily."},{"insert":"\n","attributes":{"block":true}},{"insert":" Your tattoo may itch\u2014this is normal! Don\u2019t scratch."},{"insert":"\n","attributes":{"block":true}},{"insert":" Keep it clean and dry. Showers are fine, but avoid soaking."},{"insert":"\n","attributes":{"block":true}},{"insert":" Stay out of direct sunlight and avoid tanning on or around the"},{"insert":"\n","attributes":{"block":true}},{"insert":"tattoo."},{"insert":"\n","attributes":{"block":true}},{"insert":"Short-Term Care Tips","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"Do not:","attributes":{"italic":true}},{"insert":"\n","attributes":{"block":true}},{"insert":" Do not Itch, pick at, or tear o\udbff\udc00 flakes\/scabs."},{"insert":"\n","attributes":{"block":true}},{"insert":"Do not overhydrate your tattoo with aftercare cream or lotions.  Do not apply scented lotions or medicated ointments (e.g.,polysporin) during healing. Avoid petroleum jelly."},{"insert":"\n","attributes":{"block":true}},{"insert":" Do not tan or expose tattoo to direct sunlight until fully healed."},{"insert":"\n","attributes":{"block":true}},{"insert":"Do not wear tight clothing that might irritate the area while healing. Do not let your tattoo dry out or stay too moist. Balance is key."},{"insert":"\n\n","attributes":{"block":true}},{"insert":"Do:","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"Once dry, apply a thin layer of unscented lotion or tattoo-specific"},{"insert":"\n","attributes":{"block":true}},{"insert":"ointment (like Aquaphor or Hustle Butter)."},{"insert":"\n","attributes":{"block":true}},{"insert":"If you notice signs of infection (excessive redness, swelling, pus, or fever), contact a healthcare provider."},{"insert":"\n","attributes":{"block":true}},{"insert":" Remove the bandage gently and wash the tattoo with lukewarm"},{"insert":"\n","attributes":{"block":true}},{"insert":"water and a mild, fragrance-free soap (like Dove or Cetaphil)."},{"insert":"\n","attributes":{"block":true}},{"insert":"Long-Term Care Tips"},{"insert":"\n","attributes":{"block":true}},{"insert":"After healing, apply sunscreen (SPF 30+) when exposing your tattoo to sunlight to prevent fading."},{"insert":"\n","attributes":{"block":true}},{"insert":" Keep skin moisturized to maintain vibrancy."},{"insert":"\n","attributes":{"block":true}}]}}},"title":{"title":"Distinctive and Bold"}}],"sectionTitle":{"title":{"quill":{"ops":[{"insert":"Tattoo Aftercare\n"}]}},"hidden":false}}}},{"id":"a5953280-013c-11f1-bb13-793dae9790fc","type":"cell","content":{"id":"a5953281-013c-11f1-bb13-793dae9790fc","type":"block","layout":"text-4","purpose":"text@^1.0.0","properties":{"shortID":"PGtfSN","settings":{"texts":{}},"repeatables":[{"id":1,"link":{"label":"Learn more"},"text":{"content":{"quill":{"ops":[{"insert":"Irritation vs. Infection ","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}},{"insert":"Most piercing issues are "},{"insert":"irritation","attributes":{"bold":true}},{"insert":", not infection. Irritation is usually caused by things like excess movement, pressure, improper jewelry, poor aftercare, or being slept on. Common signs include redness, swelling, tenderness, clear or whitish discharge, and soreness that comes and goes.\n\n"},{"insert":"Infections are far less common","attributes":{"bold":true}},{"insert":", but more serious. Warning signs may include worsening pain, spreading redness, heat, thick yellow or green discharge, fever, or swelling that continues to increase instead of improve. If you suspect an infection, seek medical care promptly\u2014do not remove the jewelry unless directed by a medical professional.\n\nIf your piercing feels \u201cangry,\u201d it doesn\u2019t automatically mean something is wrong. Proper jewelry, gentle aftercare, and patience are often all that\u2019s needed. \n\nWhen in doubt, please reach out. I am happy to answer and question and have a look at it."},{"insert":"\n","attributes":{"block":true}},{"insert":"\n"}]}}},"title":{"title":"Distinctive and Bold"}}],"sectionTitle":{"align":"center","title":{"quill":{"ops":[{"insert":"Irritation vs Infection\n"}]}}}}}},{"id":"bb46c970-0161-11f1-99b6-a7b46f57fa78","type":"cell","content":{"id":"bb46c971-0161-11f1-99b6-a7b46f57fa78","type":"block","layout":"text-4","purpose":"text@^1.0.0","properties":{"shortID":"SWtPzC","settings":{"texts":{"fontSize":"step-0","textStyle":"body"},"titles":{"hidden":true}},"repeatables":[{"id":1,"link":{"label":"Learn more"},"text":{"content":{"quill":{"ops":[{"insert":"When can i swim after getting poked?","attributes":{"bold":true}},{"insert":"\n","attributes":{"block":true}}]}}},"title":{"title":"Distinctive and Bold"}},{"id":2,"link":{"label":"Learn more"},"text":{"content":{"quill":{"ops":[{"insert":"for lobe piercings you can swim after 6-8 weeks and for any cartilage piercings it is recommended to wait 12 weeks. The reason for this is because lakes, rivers, pools and the ocean have bacteria in them. This can cause irritation and also infection. Just because the outside of your piercing looks healed doesn\u2019t mean the inside of it is. "},{"insert":"\n\n","attributes":{"block":true}},{"insert":"Can i work out after getting pierced?","attributes":{"bold":true}},{"insert":"\n\n","attributes":{"block":true}},{"insert":"yes most of the time you can workout after getting poked. If piercing is on ear or face make sure you are cleaning it well after exercise as there can be sweat buildup and avoid any friction causing motions. "},{"insert":"\n","attributes":{"block":true}},{"insert":"Navels ","attributes":{"bold":true}},{"insert":"on the other hand, i would recommend avoiding anything that compresses your stomach for the first two weeks. This motion can cause irritation and delayed healing. Focus on leg or arm day during this time."},{"insert":"\n\n","attributes":{"block":true}},{"insert":"when can i change jewelry?","attributes":{"bold":true}},{"insert":"\n\n","attributes":{"block":true}},{"insert":"i would recommend waiting at least 3-4 months before changing it to your own jewelry or hoops, we will do a downsize at about 1-2 months depending on your healing."},{"insert":"\n\n","attributes":{"block":true}},{"insert":"what is a downsize?","attributes":{"bold":true}},{"insert":"\n\n","attributes":{"block":true}},{"insert":"Downsizing the jewelry is an important part of the healing process. The initial flat back \/ post is longer to accommodate any swelling that might occur. Downsizing the jewelry reduces irritation and also promotes better healing.  Not only does it improve the comfort and appearance it protects teeth and gums; specifically for lip and tongue piercings. "},{"insert":"\n","attributes":{"block":true}},{"insert":" "},{"insert":"\n","attributes":{"block":true}}]}}},"title":{"title":"Distinctive and Bold"}}],"sectionTitle":{"title":{"quill":{"ops":[{"insert":"Common Questions \n"}]}}}}}},{"id":"002167b0-0204-11f1-a069-ad98581a687a","type":"cell","content":{"id":"002167b1-0204-11f1-a069-ad98581a687a","type":"block","layout":"basic-text","purpose":"text@^1.0.0","properties":{"shortID":"zmVFCU","settings":{"links":{"hidden":true},"texts":{"fontSize":"step-1","textStyle":"title"},"titles":{"hidden":true}},"textAlign":"","columnCount":1,"repeatables":[{"id":1,"link":{"label":"Learn more"},"text":{"content":{"quill":{"ops":[{"insert":"Meet the bugs at the studio","attributes":{"italic":true}},{"insert":"\n","attributes":{"block":true}}]}}},"title":{"ti
